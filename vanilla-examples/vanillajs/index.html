<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<title>VanillaJS • TodoMVC</title>
	<link rel="stylesheet" href="../../assets/base.css">
	<link rel="stylesheet" href="css/app.css">
	<!--[if IE]>
	<script src="../../assets/ie.js"></script>
	<![endif]-->
</head>
<body>
	<section id="todoapp">
		<header id="header">
			<h1>todos</h1>
			<div id="new-todo-row">
				<select id="new-todo-priority" title="Priority">
					<option value="low">Low</option>
					<option value="medium" selected>Medium</option>
					<option value="high">High</option>
				</select>
				<input id="new-todo" placeholder="What needs to be done?" autofocus>
				<input id="new-todo-due" type="date" title="Due date">
			</div>
		</header>
		<section id="main">
			<input id="toggle-all" type="checkbox">
			<label for="toggle-all">Mark all as complete</label>
			<ul id="todo-list"></ul>
		</section>
		<footer id="footer">
			<span id="todo-count"></span>
			<ul id="filters">
				<li><a href="#/" class="selected">All</a></li>
				<li><a href="#/active">Active</a></li>
				<li><a href="#/completed">Completed</a></li>
			</ul>
			<button id="clear-completed">Clear completed</button>
		</footer>
	</section>
	<footer id="info">
		<p>Double-click to edit a todo</p>
		<p>Template by <a href="http://github.com/sindresorhus">Sindre Sorhus</a></p>
		<p>Created by <a href="http://twitter.com/ffesseler">Florian Fesseler</a></p>
		<p>Cleanup, edits by <a href="http://github.com/boushley">Aaron Boushley</a></p>
	</footer>
	<script src="../../assets/base.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
